[project]
name = "centralign-operator"
version = "0.1.0"
description = "An autonomous AI operator that turns a company request into completed, verified work."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "playwright>=1.44",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The desktop surface is Windows-only and drags in Qt (~150MB), so it is an
# extra rather than a hard dependency. A Linux container running the browser and
# API surfaces should not download a GUI toolkit it can never use.
desktop = [
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "PySide6-Essentials>=6.7; sys_platform == 'win32'",
    "pillow>=10.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
operator = "centralign.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centralign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
