# Render blueprint. Having `render.yaml` in the repo root means the service can be
# created straight from the repo: New -> Blueprint -> pick this repo.
#
# `free` is not a compromise here, it is a measured result. The container was run
# under a hard 512MB cap while executing a real browser run against the mock ERP:
#
#   idle                 48MB
#   peak, Chromium up   259MB
#   OOM killed          no
#
# Chromium is launched only while a run is executing and the context is torn down
# with the run, so the steady state is small. The free tier does spin down after
# ~15 minutes of inactivity, so the first request after a quiet spell takes about
# a minute to cold start. That is the real cost of `free`, not memory.
#
# Set GEMINI_API_KEY and OPERATOR_DEMO_TOKEN in the Render dashboard to let the
# deployed instance actually run the operator. Leave them unset and the instance
# stays read-only: visitors browse recorded runs and evidence, nothing is spent.
services:
  - type: web
    name: centralign-operator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/runs
    envVars:
      - key: OPERATOR_PUBLIC_DEMO
        value: "1"
      - key: OPERATOR_HEADLESS
        value: "1"
      - key: OPERATOR_LLM_PROVIDER
        value: gemini
      # Gemini's free tier meters 20 requests per day PER MODEL, and one run costs
      # roughly 25 calls. A nine-model chain is what makes a public instance last
      # a day rather than a single visitor.
      - key: OPERATOR_LLM_MODEL
        value: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemma-4-31b-it
      - key: GEMINI_API_KEY
        sync: false        # paste in the dashboard; never committed
      - key: OPERATOR_DEMO_TOKEN
        sync: false        # the access code that lets a visitor start a run
      # A deployed run gets less CPU than a laptop, so give it more wall clock
      # before the budget calls time.
      - key: OPERATOR_WALL_CLOCK_SECONDS
        value: "1500"
      - key: OPERATOR_MAX_STEPS
        value: "60"
