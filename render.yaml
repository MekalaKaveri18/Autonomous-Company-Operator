# Render blueprint. `render.yaml` in the repo root means the service can be
# created straight from the repo with no console clicking.
#
# `free` is deliberate, and it works because of what read-only mode does NOT do.
# With OPERATOR_PUBLIC_DEMO=1 and no token, no run can start, so Chromium is never
# launched: the container is just Python, FastAPI and SQLite. Measured footprint
# is ~50MB against the free tier's 512MB. Visitors browse every recorded run,
# its full decision stream and its evidence bundle.
#
# To let the deployed instance actually RUN the operator, set GEMINI_API_KEY and
# OPERATOR_DEMO_TOKEN and move to `standard`. Chromium alone wants roughly 512MB,
# so the free tier will be OOM-killed mid-browse -- the failure looks like a
# mysterious restart rather than an out-of-memory error, which is worth knowing
# before you spend an afternoon on it.
services:
  - type: web
    name: centralign-operator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/runs
    envVars:
      - key: OPERATOR_PUBLIC_DEMO
        value: "1"
      - key: OPERATOR_HEADLESS
        value: "1"
      - key: OPERATOR_LLM_PROVIDER
        value: gemini
      # The free Gemini tier meters 20 requests per day PER MODEL, so a wide
      # chain is what makes a live instance usable rather than a one-run novelty.
      - key: OPERATOR_LLM_MODEL
        value: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemma-4-31b-it
      # Both unset on purpose: without a key and a token the instance stays
      # read-only, which is what keeps it free and keeps a passing visitor from
      # spending the owner's daily quota.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPERATOR_DEMO_TOKEN
        sync: false
      - key: OPERATOR_WALL_CLOCK_SECONDS
        value: "900"
